name: Build MakerFox Studio Windows installer
# Test branch build includes the latest catalog and collection fixes.

on:
  push:
    branches:
      - release/v1.2.0
      - feature/v1.2.7-categorias-pedidos
      - feature/v1.3.0-calculadora-inventario-cotizaciones
      - fix/pedidos-respaldo-operativo-1.3.5
      - simplify/calculadora-catalogo
      - release/makerfox-studio-2.0.0
      - test/makerfox-studio-2.0-catalog-fix
    tags:
      - "v*"
    paths:
      - "index.html"
      - "main.js"
      - "preload.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches:
      - simplify/calculadora-catalogo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate embedded JavaScript syntax
        run: |
          node -e "const fs=require('fs'),vm=require('vm'),html=fs.readFileSync('index.html','utf8'),a=html.indexOf('<script>')+8,b=html.indexOf('</script>',a);if(a<8||b<0)throw Error('Script not found');new vm.Script(html.slice(a,b));console.log('index.html JavaScript syntax OK')"
      - name: Build installer for branch validation
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
        run: npm run dist -- --publish never
      - name: Publish GitHub Release and updater files
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload test installer artifact
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: MakerFox-Studio-Windows-v2.0-test
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
