name: Build and publish MakerFox Windows installer

on:
  push:
    branches:
      - release/v1.2.0
    tags:
      - "v*"
    paths:
      - "index.html"
      - "main.js"
      - "preload.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build installer for branch validation
        if: startsWith(github.ref, 'refs/heads/')
        run: npm run dist -- --publish never
      - name: Publish GitHub Release and updater files
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload test installer artifact
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: MakerFox-Desktop-Windows-v1.2.5-test
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
