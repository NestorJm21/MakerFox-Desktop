<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><link rel="manifest" href="./manifest.webmanifest"><title>MakerFox Móvil</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b21;--line:#343943;--muted:#a1a1aa;--red:#e3262e;--text:#f4f4f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,Arial}header{padding:22px 18px;background:#17191f;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.brand{font-size:24px;font-weight:900;letter-spacing:1px}.brand span{color:var(--red)}main{max-width:760px;margin:auto;padding:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px}h2{font-size:18px;margin:0 0 14px}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}input,select,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid var(--line);background:#101217;color:var(--text);font:inherit}button{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#252832;color:white;font-weight:700;font-size:14px}button.primary{background:var(--red);border-color:var(--red)}button:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.order{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0}.order strong{font-size:15px}.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#382024;color:#ff9da1;font-size:11px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .full{grid-column:1/-1}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="brand">MAKER<span>FOX</span></div><div class="muted">Pedidos · móvil</div></header>
<main>
<section id="login" class="card"><h2>Acceso privado</h2><p class="muted">Solo cuentas autorizadas de MakerFox.</p><label>Correo</label><input id="email" type="email" autocomplete="username"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button id="loginBtn" class="primary">Iniciar sesión</button></div><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden">
<div class="card"><div class="topline"><div><h2 style="margin:0">Pedidos</h2><div id="who" class="muted"></div></div><button id="logout">Salir</button></div><p id="status" class="muted">Conectando…</p><div class="actions"><button id="refresh">Actualizar</button><button id="newBtn" class="primary">+ Nuevo pedido</button></div></div>
<section id="form" class="card hidden"><h2>Nuevo pedido</h2><div class="grid"><div><label>Cliente *</label><input id="client" required></div><div><label>Teléfono</label><input id="phone" inputmode="tel"></div><div><label>Fecha de entrega</label><input id="due" type="date"></div><div><label>Prioridad</label><select id="priority"><option>Normal</option><option>Urgente</option></select></div><div class="full"><label>Producto / descripción *</label><input id="description" placeholder="Ej. Cascanueces personalizado"></div><div><label>Cantidad</label><input id="qty" type="number" min="1" value="1"></div><div><label>Precio total (MXN)</label><input id="total" type="number" min="0" step=".01" value="0"></div><div><label>Anticipo pagado</label><input id="paid" type="number" min="0" step=".01" value="0"></div><div><label>Estado</label><select id="orderStatus"><option>En proceso</option><option>Listo</option></select></div><div class="full"><label>Notas</label><textarea id="notes" rows="2"></textarea></div></div><div class="actions"><button id="save" class="primary">Guardar pedido</button><button id="cancel">Cancelar</button></div><p id="formMsg" class="muted"></p></section>
<div id="orders"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL='https://mmbblrxbwmxnwcjocjjn.supabase.co', KEY='sb_publishable_daNSCBU_PyLX5WPg16bleQ_D4FdT004';
const $=id=>document.getElementById(id);let sb,user,channel;
function msg(id,s){$(id).textContent=s}
function money(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n)||0)}
function showApp(u){user=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=u.email;load()}
async function load(){msg('status','Sincronizando pedidos…');const {data,error}=await sb.from('orders').select('*').is('deleted_at',null).order('updated_at',{ascending:false});if(error){msg('status','Error: '+error.message);return}render(data||[]);msg('status','En línea · '+data.length+' pedidos');}
function render(rows){$('orders').innerHTML=rows.map(r=>{const o=r.data||{};return '<article class="order"><div class="topline"><strong>'+esc(o.number||r.id)+' · '+esc(o.client||'Sin cliente')+'</strong><span class="pill">'+esc(o.status||'En proceso')+'</span></div><p class="muted">'+esc(o.description||'')+' · Entrega: '+esc(o.dueDate||'Sin fecha')+'</p><p>Total '+money(o.total)+' · Pagado '+money(o.paid)+' · Saldo '+money(o.balance??((o.total||0)-(o.paid||0)))+'</p><div class="actions"><button data-status="'+r.id+'" data-value="Listo">Listo</button><button data-status="'+r.id+'" data-value="En proceso">En proceso</button><button class="primary" data-deliver="'+r.id+'">Entregado</button></div></article>'}).join('')||'<div class="card muted">No hay pedidos todavía.</div>';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>change(b.dataset.status,{status:b.dataset.value}));document.querySelectorAll('[data-deliver]').forEach(b=>b.onclick=()=>change(b.dataset.deliver,{status:'Entregado',deliveredAt:new Date().toISOString()}));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function change(id,patch){const {data,error}=await sb.from('orders').select('*').eq('id',id).single();if(error){alert(error.message);return}const o={...data.data,...patch,updated:new Date().toISOString()};const res=await sb.from('orders').update({data:o,updated_at:o.updated}).eq('id',id);if(res.error)alert(res.error.message);else load()}
$('loginBtn').onclick=async()=>{const btn=$('loginBtn');btn.disabled=true;msg('loginMsg','Conectando con MakerFox…');try{if(!sb)throw new Error('El servicio todavía está cargando. Recarga la página e inténtalo de nuevo.');const attempt=sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});const result=await Promise.race([attempt,new Promise((_,reject)=>setTimeout(()=>reject(new Error('La conexión tardó más de 15 segundos. Revisa tu internet o intenta abrir la página en Chrome.')),15000))]);const {data,error}=result;if(error)throw error;$('password').value='';showApp(data.user);subscribe()}catch(e){msg('loginMsg','No se pudo iniciar sesión: '+(e?.message||'Error desconocido'));}finally{btn.disabled=false}};
$('logout').onclick=async()=>{if(channel)await sb.removeChannel(channel);await sb.auth.signOut();user=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')};
$('refresh').onclick=load;$('newBtn').onclick=()=>$('form').classList.toggle('hidden');$('cancel').onclick=()=>$('form').classList.add('hidden');
$('save').onclick=async()=>{const client=$('client').value.trim(),description=$('description').value.trim();if(!client||!description){msg('formMsg','Completa cliente y descripción.');return}const total=Number($('total').value)||0,paid=Number($('paid').value)||0,now=new Date().toISOString();const o={id:crypto.randomUUID(),number:'PED-'+Math.floor(100000+Math.random()*900000),client,phone:$('phone').value,dueDate:$('due').value,priority:$('priority').value,status:$('orderStatus').value,description,lines:[{name:description,qty:Number($('qty').value)||1,price:total}],total,paid,balance:total-paid,payment:'',created:now,updated:now,notes:$('notes').value};const {error}=await sb.from('orders').insert({id:o.id,data:o,updated_at:now,deleted_at:null});if(error){msg('formMsg','No se guardó: '+error.message);return}$('form').classList.add('hidden');['client','phone','description','notes'].forEach(id=>$(id).value='');$('total').value='0';$('paid').value='0';$('qty').value='1';msg('formMsg','Pedido guardado.');load()};
function subscribe(){channel=sb.channel('mobile-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>load()).subscribe(s=>{if(s==='SUBSCRIBED')msg('status','En línea · sincronización en tiempo real')})}
(async()=>{if(!window.supabase){msg('loginMsg','No se pudo cargar el servicio. Revisa tu conexión.');return}sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const {data}=await sb.auth.getSession();if(data.session){showApp(data.session.user);subscribe()}})();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
