<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><link rel="manifest" href="./manifest.webmanifest"><title>MakerFox Móvil</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b21;--line:#343943;--muted:#a1a1aa;--red:#e3262e;--text:#f4f4f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,Arial}header{padding:22px 18px;background:#17191f;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.brand{font-size:24px;font-weight:900;letter-spacing:1px}.brand span{color:var(--red)}main{max-width:760px;margin:auto;padding:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 8px}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}input,select,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid var(--line);background:#101217;color:var(--text);font:inherit}button{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#252832;color:white;font-weight:700;font-size:14px}button.primary{background:var(--red);border-color:var(--red)}button:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.order{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0}.order.priority-urgent:not(.status-ready):not(.status-delivered){background:#501b20;border-color:#b8323b}.order.priority-high:not(.status-ready):not(.status-delivered){background:#4a2b10;border-color:#b8752e}.order.priority-normal:not(.status-ready):not(.status-delivered){background:#172f4a;border-color:#315d87}.order.priority-low:not(.status-ready):not(.status-delivered){background:#303238;border-color:#62656d}.order.status-ready,.order.status-delivered{background:#153b2a;border-color:#268653}.order.status-ready .topline strong,.order.status-delivered .topline strong{color:#a6f0bf}.order strong{font-size:15px}.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#382024;color:#ff9da1;font-size:11px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .full{grid-column:1/-1}.line{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:0}.line small{display:block;color:var(--muted)}.line button{padding:7px 10px}.summary{background:#101217;border:1px solid var(--line);padding:12px;border-radius:10px;margin-top:12px}.summary strong{font-size:20px}.hint{font-size:12px;color:var(--muted);margin-top:7px}.section-title{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}@media(max-width:420px){.grid{grid-template-columns:1fr}.grid .full{grid-column:auto}}
</style></head><body>
<header><div class="brand">MAKER<span>FOX</span></div><div class="muted">Pedidos · móvil</div></header>
<main>
<section id="login" class="card"><h2>Acceso privado</h2><p class="muted">Solo cuentas autorizadas de MakerFox.</p><label>Correo</label><input id="email" type="email" autocomplete="username"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button id="loginBtn" class="primary">Iniciar sesión</button></div><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden">
<div class="card"><div class="topline"><div><h2 style="margin:0">Pedidos</h2><div id="who" class="muted"></div></div><button id="logout">Salir</button></div><p id="status" class="muted">Conectando…</p><div class="actions"><button id="refresh">Actualizar</button><button id="newBtn" class="primary">+ Nuevo pedido</button></div></div>
<section id="form" class="card hidden"><h2>Nuevo pedido</h2>
<div class="grid">
<div><label>Cliente *</label><input id="client" required autocomplete="name"></div><div><label>Teléfono</label><input id="phone" inputmode="tel"></div>
<div><label>Fecha de entrega</label><input id="due" type="date"></div><div><label>Prioridad</label><select id="priority"><option value="normal">Normal · Azul</option><option value="urgent">Urgente · Rojo</option><option value="high">Alta · Naranja</option><option value="low">Baja · Gris</option></select></div>
<div><label>Estado</label><select id="orderStatus"><option value="pending">Pendiente</option><option value="process">En proceso</option><option value="ready">Listo para entregar</option></select></div>
<div><label>Buscar en catálogo</label><input id="productSearch" placeholder="Nombre o clave del producto"></div>
<div class="full"><label>Producto del catálogo</label><select id="product"></select><div id="productHint" class="hint">Cargando catálogo…</div></div>
<div><label>Cantidad</label><input id="qty" type="number" min="1" step="1" value="1"></div>
<div><label>Multiplicador</label><select id="multiplier"><option value="2">×2</option><option value="2.5" selected>×2.5</option><option value="3">×3</option><option value="3.5">×3.5</option><option value="4">×4</option><option value="5">×5</option></select></div>
<div><label>Precio personalizado por unidad ($) · opcional</label><input id="customPrice" type="number" min="0" step=".01" placeholder="Usar multiplicador"></div>
<div class="full"><button id="addLine">+ Agregar producto al pedido</button><div id="lines"></div></div>
<div><label>Anticipo pagado ($)</label><input id="paid" type="number" min="0" step=".01" value="0"></div>
<div><label>Notas / descripción</label><textarea id="notes" rows="2" placeholder="Detalles, colores, personalización…"></textarea></div>
</div>
<div class="summary"><div class="muted">TOTAL DEL PEDIDO</div><strong id="totalView">$0.00</strong><div class="hint">Saldo pendiente: <b id="balanceView">$0.00</b> · Estado de pago: <b id="paymentView">Sin pago</b></div></div>
<div class="actions"><button id="save" class="primary">Guardar pedido</button><button id="cancel">Cancelar</button></div><p id="formMsg" class="muted"></p></section>
<div id="orders"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://mmbblrxbwmxncwjcojjn.supabase.co', KEY='sb_publishable_daNSCBU_PyLX5WPg16bleQ_D4FdT004';
const $=id=>document.getElementById(id);let sb,user,channel,products=[],orderLines=[],busy=false;
function msg(id,s){$(id).textContent=s}
function getClient(){if(sb)return sb;if(!window.supabase?.createClient)throw new Error('No se pudo cargar la librería de conexión. Abre la página en Chrome y vuelve a intentarlo.');sb=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});return sb}
function money(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showApp(u){user=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=u.email;loadAll()}
function productCost(p){return Number(p?.cost??p?.total??0)}
function filteredProducts(){const q=$('productSearch').value.trim().toLowerCase();return products.filter(p=>!p._deleted&&(!q||String(p.name+' '+p.sku).toLowerCase().includes(q)))}
function refreshProductOptions(){const list=filteredProducts(),prev=$('product').value;$('product').innerHTML=list.map(p=>'<option value="'+esc(p.id)+'">'+esc((p.sku?p.sku+' · ':'')+p.name)+'</option>').join('')||'<option value="">No hay productos disponibles</option>';if(list.some(p=>String(p.id)===prev))$('product').value=prev;hintProduct()}
function selectedProduct(){return products.find(p=>String(p.id)===$('product').value&&!p._deleted)}
function hintProduct(){const p=selectedProduct();if(!p){msg('productHint',products.length?'No hay coincidencias. Cambia la búsqueda.':'El catálogo todavía no tiene productos sincronizados. Abre MakerFox Desktop, inicia la sincronización y vuelve a actualizar.');return}const m=Number($('multiplier').value)||2.5,qty=Math.max(1,Math.floor(Number($('qty').value)||1)),custom=$('customPrice').value.trim(),unit=custom===''?productCost(p)*m:Number(custom);msg('productHint','Clave: '+(p.sku||'Sin clave')+' · Costo: '+money(productCost(p))+' · Precio unitario: '+money(unit)+' · '+qty+' pieza(s): '+money(unit*qty))}
function totals(){const total=orderLines.reduce((a,l)=>a+l.qty*l.unitPrice,0),paid=Number($('paid').value)||0,balance=total-paid;$('totalView').textContent=money(total);$('balanceView').textContent=money(balance);$('paymentView').textContent=paid<=0?'Sin pago':paid+0.001>=total?'Pagado':'Parcial';return{total,paid,balance,payment:paid<=0?'unpaid':paid+0.001>=total?'paid':'partial'}}
function renderLines(){$('lines').innerHTML=orderLines.length?orderLines.map((l,i)=>'<div class="line"><div><b>'+esc(l.name)+' × '+l.qty+'</b><small>'+money(l.unitPrice)+' por unidad</small></div><div><b>'+money(l.qty*l.unitPrice)+'</b> <button type="button" data-remove="'+i+'">Quitar</button></div></div>').join(''):'<p class="hint">Todavía no agregas productos.</p>';$('lines').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{orderLines.splice(Number(b.dataset.remove),1);renderLines()});totals()}
async function loadProducts(){const {data,error}=await sb.from('products').select('id,data,updated_at,deleted_at').order('updated_at',{ascending:false});if(error)throw error;products=(data||[]).filter(r=>!r.deleted_at&&r.data).map(r=>({...r.data,id:r.id}));refreshProductOptions()}
async function loadOrders(){const {data,error}=await sb.from('orders').select('id,data,updated_at,deleted_at').is('deleted_at',null).order('updated_at',{ascending:false});if(error)throw error;render(data||[])}
async function loadAll(){if(busy)return;busy=true;msg('status','Sincronizando catálogo y pedidos…');try{await Promise.all([loadProducts(),loadOrders()]);msg('status','En línea · '+products.length+' productos en catálogo')}catch(e){msg('status','Error de sincronización: '+e.message)}finally{busy=false}}
function statusLabel(v){return({pending:'Pendiente',process:'En proceso',ready:'Listo',delivered:'Entregado'})[v]||v||'En proceso'}
function priorityLabel(v){return({urgent:'URGENTE',high:'ALTA',normal:'NORMAL',low:'BAJA'})[v]||'NORMAL'}
function render(rows){$('orders').innerHTML=rows.map(r=>{const o=r.data||{},lines=Array.isArray(o.lines)&&o.lines.length?o.lines:[{name:o.description||'Pedido',qty:o.qty||1,unitPrice:o.total||0}];return '<article class="order priority-'+esc(o.priority||'normal')+' status-'+esc(o.status||'pending')+'"><div class="topline"><strong>'+esc(o.number||r.id)+' · '+esc(o.client||'Sin cliente')+'</strong><span class="pill">'+esc(statusLabel(o.status))+'</span></div><p class="muted">'+esc(o.phone||'Sin teléfono')+' · Entrega: '+esc(o.dueDate||'Sin fecha')+' · Prioridad: '+priorityLabel(o.priority)+'</p>'+lines.map(l=>'<div class="line"><span>'+esc(l.name)+' × '+Number(l.qty||1)+'</span><b>'+money(Number(l.unitPrice??l.price??0)*Number(l.qty||1))+'</b></div>').join('')+'<p>Total '+money(o.total)+' · Pagado '+money(o.paid)+' · Saldo '+money(o.balance??((o.total||0)-(o.paid||0)))+'</p><div class="actions">'+(o.status!=='delivered'?'<button data-status="'+esc(r.id)+'" data-value="ready">Listo</button><button data-status="'+esc(r.id)+'" data-value="process">En proceso</button><button class="primary" data-deliver="'+esc(r.id)+'">Entregado</button>':'<span class="muted">Pedido entregado</span>')+'</div></article>'}).join('')||'<div class="card muted">No hay pedidos todavía.</div>';$('orders').querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>change(b.dataset.status,{status:b.dataset.value}));$('orders').querySelectorAll('[data-deliver]').forEach(b=>b.onclick=()=>change(b.dataset.deliver,{status:'delivered',deliveredAt:new Date().toISOString()}))}
async function change(id,patch){const {data,error}=await sb.from('orders').select('*').eq('id',id).single();if(error){alert(error.message);return}const o={...data.data,...patch,updated:new Date().toISOString()};const res=await sb.from('orders').update({data:o,updated_at:o.updated}).eq('id',id);if(res.error)alert(res.error.message);else loadOrders()}
function resetForm(){orderLines=[];['client','phone','due','notes','productSearch','customPrice'].forEach(id=>$(id).value='');$('priority').value='normal';$('orderStatus').value='pending';$('qty').value='1';$('multiplier').value='2.5';$('paid').value='0';refreshProductOptions();renderLines();msg('formMsg','')}
$('loginBtn').onclick=async()=>{const btn=$('loginBtn');btn.disabled=true;msg('loginMsg','Conectando con MakerFox…');try{const client=getClient();const attempt=client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});const result=await Promise.race([attempt,new Promise((_,reject)=>setTimeout(()=>reject(new Error('La conexión tardó más de 15 segundos. Revisa tu internet o intenta abrir la página en Chrome.')),15000))]);const {data,error}=result;if(error)throw error;$('password').value='';showApp(data.user);subscribe()}catch(e){msg('loginMsg','No se pudo iniciar sesión: '+(e?.message||'Error desconocido'))}finally{btn.disabled=false}};
$('logout').onclick=async()=>{if(channel)await sb.removeChannel(channel);channel=null;await sb.auth.signOut();user=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')};
$('refresh').onclick=loadAll;$('newBtn').onclick=()=>{$('form').classList.toggle('hidden');if(!$('form').classList.contains('hidden'))resetForm()};$('cancel').onclick=()=>{$('form').classList.add('hidden');resetForm()};
$('productSearch').oninput=refreshProductOptions;['product','qty','multiplier','customPrice'].forEach(id=>$(id).addEventListener('input',hintProduct));$('paid').oninput=totals;
$('addLine').onclick=()=>{const p=selectedProduct();if(!p){msg('formMsg','Selecciona un producto del catálogo.');return}const qty=Math.max(1,Math.floor(Number($('qty').value)||1)),m=Number($('multiplier').value)||2.5,custom=$('customPrice').value.trim(),unitPrice=custom===''?productCost(p)*m:Number(custom);if(!Number.isFinite(unitPrice)||unitPrice<0){msg('formMsg','El precio personalizado no es válido.');return}orderLines.push({productId:p.id,sku:p.sku,name:p.name,qty,unitPrice,multiplier:m,customPrice:custom!==''?unitPrice:null,cost:productCost(p),time:qty===1&&p.time!=null?p.time:null,grams:p.grams||0});$('customPrice').value='';renderLines();hintProduct();msg('formMsg','')}
$('save').onclick=async()=>{const client=$('client').value.trim();if(!client){msg('formMsg','Escribe el nombre del cliente.');return}if(!orderLines.length){msg('formMsg','Agrega al menos un producto del catálogo.');return}const t=totals();if(t.paid<0||t.paid>t.total){msg('formMsg','El anticipo no puede ser mayor que el total.');return}const now=new Date().toISOString(),notes=$('notes').value.trim(),o={id:crypto.randomUUID(),number:'PED-'+String(Date.now()).slice(-6),client,phone:$('phone').value.trim(),dueDate:$('due').value,priority:$('priority').value,status:$('orderStatus').value,description:notes,lines:orderLines,total:t.total,paid:t.paid,balance:t.balance,payment:t.payment,created:now,updated:now,deliveredAt:null};const btn=$('save');btn.disabled=true;try{const {error}=await sb.from('orders').insert({id:o.id,data:o,updated_at:now,deleted_at:null});if(error)throw error;$('form').classList.add('hidden');resetForm();await loadAll();msg('formMsg','Pedido guardado correctamente.')}catch(e){msg('formMsg','No se guardó: '+e.message)}finally{btn.disabled=false}};
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('mobile-makerfox-live').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders()).on('postgres_changes',{event:'*',schema:'public',table:'products'},()=>loadProducts()).subscribe(s=>{if(s==='SUBSCRIBED')msg('status','En línea · catálogo y pedidos en tiempo real')})}
(async()=>{try{const client=getClient();const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session){showApp(data.session.user);subscribe()}}catch(e){msg('loginMsg','No se pudo preparar la conexión: '+(e?.message||'Error desconocido'))}})();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
